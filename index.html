<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Dagnanleach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --tan: #C8965A;
    --tan-light: #E8C99A;
    --tan-lighter: #F5E8D0;
    --tan-dark: #8B6240;
    --cream: #FAF5EC;
    --brown: #2D1F0F;
    --brown-light: #7A5C3A;
    --ink: #1A1008;
  }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--brown);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .logo {
    width: 140px;
    height: 140px;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .name {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .title {
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--tan);
  }
  .bio {
    font-size: 1rem;
    color: var(--brown-light);
    line-height: 1.75;
    font-weight: 300;
    max-width: 380px;
  }
  .divider {
    width: 40px;
    height: 1px;
    background: rgba(200, 150, 90, 0.4);
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    margin-top: 0.5rem;
  }
  .btn-book {
    background: var(--brown);
    color: var(--tan-lighter);
    border: none;
    padding: 1rem 2rem;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-book:hover { background: var(--tan-dark); transform: translateY(-2px); }
  .btn-linkedin {
    background: transparent;
    color: var(--brown);
    border: 1.5px solid rgba(90, 50, 20, 0.25);
    padding: 1rem 2rem;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    transition: border-color 0.2s, color 0.2s, transform 0.15s;
  }
  .btn-linkedin:hover { border-color: var(--tan-dark); color: var(--tan-dark); transform: translateY(-2px); }
  .btn-linkedin svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  .btn-book svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
